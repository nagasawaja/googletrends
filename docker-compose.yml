services:
  googletrends:
    build:
      context: .
    container_name: googletrends-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLETRENDS_DB_PATH: /app/data/googletrends.sqlite3
      GOOGLETRENDS_PUBLIC_BASE_URL: http://127.0.0.1:8000
      GOOGLETRENDS_PROXY_URLS: ${GOOGLETRENDS_PROXY_URLS:-http://host.docker.internal:7890}
      GOOGLETRENDS_PROXY_AUTO_DETECT_LOCAL_CLASH: ${GOOGLETRENDS_PROXY_AUTO_DETECT_LOCAL_CLASH:-0}
      GOOGLETRENDS_CLASH_ENABLED: ${GOOGLETRENDS_CLASH_ENABLED:-1}
      GOOGLETRENDS_CLASH_CONTROLLER_URL: ${GOOGLETRENDS_CLASH_CONTROLLER_URL:-http://host.docker.internal:49266}
      GOOGLETRENDS_CLASH_SECRET: ${GOOGLETRENDS_CLASH_SECRET:-3840d101-9193-4858-a7e7-9ffa71a4368e}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
