[project]
name = "googletrends-mvp"
version = "0.1.0"
description = "A low-cost scheduled Google Trends monitoring MVP."
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.110.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pytrends>=4.9.2",
    "PyYAML>=6.0.0",
    "requests[socks]>=2.31.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "playwright>=1.49.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["googletrends_app*"]
